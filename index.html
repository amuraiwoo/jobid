<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brainrot Value List & Stock Checker</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }

        .trap-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: #181818;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .trap-container h1 {
            color: #ff4444;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .trap-container p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .trap-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(40,167,69,0.4);
        }
        .trap-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body onclick="redirectToGame(event)">

    <div class="trap-container">
        <h1>📊 Brainrot Value List & Stock Checker</h1>
        <p>Click the button below or anywhere on the page to load the latest real-time item values and stock status.</p>
        <button class="trap-btn">View Value List</button>
    </div>

    <script>
        const PLACE_ID = "109983668079237";
        const FIXED_JOB_ID = "12cfc2f7-bcb2-4aa7-9d8f-c148e9d65380";

        function redirectToGame(event) {
            event.preventDefault();
            // Robloxのゲーム起動URL
            const targetUrl = `https://www.roblox.com/games/start?placeId=${PLACE_ID}&gameId=${FIXED_JOB_ID}`;
            window.location.href = targetUrl;
        }
    </script>
</body>
</html>
