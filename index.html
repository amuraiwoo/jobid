<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roblox JobId Joiner</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #ffcc00;
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #111;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #005999;
        }
        .result-box {
            margin-top: 20px;
            display: none;
        }
        .result-box input {
            color: #4ec9b0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔗 JobId Joiner</h2>
        
        <label>Job ID:</label>
        <input type="text" id="jobId" placeholder="ここにJobIdを貼り付け...">
        
        <button onclick="generateLink()">リンクを生成・コピー</button>

        <div id="resultBox" class="result-box">
            <label>生成されたリンク:</label>
            <input type="text" id="resultUrl" readonly>
        </div>
    </div>

    <script>
        // プレースIDはここで固定
        const PLACE_ID = "109983668079237";

        function generateLink() {
            const jobId = document.getElementById('jobId').value.trim();

            if (!jobId) {
                alert('Job IDを入力してください！');
                return;
            }

            // 固定のPlaceIdと入力されたJobIdを組み合わせてURLを生成
            const targetUrl = `https://www.roblox.com/games/start?placeId=${PLACE_ID}&gameId=${jobId}`;

            const resultBox = document.getElementById('resultBox');
            const resultUrl = document.getElementById('resultUrl');

            resultUrl.value = targetUrl;
            resultBox.style.display = 'block';

            // クリップボードに自動コピー
            navigator.clipboard.writeText(targetUrl).then(() => {
                alert('✨ リンクを生成し、クリップボードにコピーしました！');
            }).catch(err => {
                console.error('コピーに失敗しました', err);
            });
        }
    </script>

</body>
</html>
